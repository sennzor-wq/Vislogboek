<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a2a22"/>
      <stop offset="50%" stop-color="#0d3b30"/>
      <stop offset="100%" stop-color="#061c16"/>
    </linearGradient>
    <linearGradient id="fishGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>
  
  <!-- Outer Rounded Shield -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  
  <!-- Subtle Wave Ripple Background -->
  <path d="M 60 360 Q 160 330 256 360 T 452 360" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.25"/>
  <path d="M 60 395 Q 160 365 256 395 T 452 395" fill="none" stroke="#10b981" stroke-width="3" stroke-opacity="0.15"/>
  
  <!-- Hook Curve in Background -->
  <path d="M 270 110 L 270 210 Q 270 300 210 300 Q 150 300 150 240 Q 150 200 185 200" 
        fill="none" stroke="url(#gold)" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
  <circle cx="270" cy="110" r="14" fill="none" stroke="url(#gold)" stroke-width="8"/>
  
  <!-- Stylized Jumping Fish -->
  <g filter="url(#glow)">
    <!-- Main Fish Body -->
    <path d="M 120 270 C 180 180 320 180 400 240 C 370 260 320 280 250 285 C 190 290 140 285 120 270 Z" 
          fill="url(#fishGrad)"/>
    <!-- Tail Fin -->
    <path d="M 400 240 C 440 210 470 200 480 220 C 460 245 450 260 480 285 C 465 295 435 275 400 240 Z" 
          fill="#10b981"/>
    <!-- Dorsal Fin -->
    <path d="M 230 195 Q 280 150 310 190 Z" fill="#059669"/>
    <!-- Pectoral Fin -->
    <path d="M 210 265 Q 250 295 240 315 Q 215 300 210 265 Z" fill="#047857"/>
    <!-- Fish Eye -->
    <circle cx="160" cy="245" r="9" fill="#ffffff"/>
    <circle cx="158" cy="245" r="5" fill="#0f172a"/>
    <circle cx="156" cy="243" r="1.5" fill="#ffffff"/>
    <!-- Subtle Gills Arc -->
    <path d="M 190 235 Q 200 255 190 275" fill="none" stroke="#047857" stroke-width="4" stroke-linecap="round"/>
  </g>
</svg>
