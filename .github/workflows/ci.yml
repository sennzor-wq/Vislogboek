name: Vislogboek Quality Gate

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: quality-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Typecheck, tests and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Temporary, narrowly scoped exception: GHSA-fc5q-39xc-vjpf affects
      # picomatch@4.0.7. Upstream disputes the finding and no patched release
      # is available at this time. Reassess and remove this exception as soon
      # as the advisory is withdrawn/clarified or a fixed release is published.
      # All other production and full dependency advisories remain enforced.
      - name: Production dependency vulnerability audit
        run: bun audit --prod --ignore GHSA-fc5q-39xc-vjpf

      - name: Full dependency audit (fail on high and critical)
        run: bun audit --audit-level=high --ignore GHSA-fc5q-39xc-vjpf

      - name: TypeScript typecheck
        run: bun run lint

      - name: Amsterdam timezone and DST regression tests
        run: bun run tsx test-date-time.ts

      # Deterministic local suites. test-core-logic.ts currently calls the
      # live Open-Meteo API; keep it out of CI until its network calls are mocked.
      - name: Core prognosis and thermal tests
        run: bun run tsx test-thermal-and-prognosis.ts

      - name: Solar time engine tests
        run: bun run tsx test-solar-time-engine.ts

      - name: Brier integration tests
        run: bun run tsx test-brier-integration.ts

      - name: Forward validation and outcome-link tests
        run: bun run tsx test-forward-validation.ts

      - name: Advanced prognosis module tests
        run: bun run tsx test-advanced-prognosis-modules.ts

      - name: Species biology evidence registry tests
        run: bun run tsx test-research-registry.ts

      - name: Species thermal evidence context tests
        run: bun run tsx test-thermal-evidence-context.ts

      - name: Species feeding evidence context tests
        run: bun run tsx test-feeding-evidence.ts

      - name: Species feeding response output tests
        run: bun run tsx test-feeding-response-engine.ts

      - name: Species diel behaviour evidence tests
        run: bun run tsx test-diel-behavior-evidence.ts

      - name: Rod positioning tests
        run: bun run tsx test-rod-positioning.ts

      - name: Water thermal coupling tests
        run: bun run tsx test-water-thermal-coupling.ts

      - name: Water temperature learning tests
        run: bun run tsx test-water-temperature-learning.ts

      - name: Historical water temperature profile tests
        run: bun run tsx test-water-history-profile.ts

      - name: Synthetic water temperature validation
        run: bun run tsx test-water-temperature-synthetic-validation.ts

      - name: Water column physical invariants
        run: bun run tsx test-water-column-model.ts

      - name: Water column weather forcing tests
        run: bun run tsx test-water-column-weather-forcing.ts

      - name: Water column prediction and spin-up tests
        run: bun run tsx test-water-column-prediction.ts

      - name: Safe deletion tests
        run: bun run tsx test-safe-deletion.ts

      - name: Session snapshot commit tests
        run: bun run tsx test-session-snapshot-commit.ts

      - name: Prognosis interval output contract tests
        run: bun run tsx test-prognosis-interval-output.ts

      - name: Thermal interval candidate contract tests
        run: bun run tsx test-prognosis-interval-thermal.ts

      - name: Viscoach and backup normalization tests
        run: bun run tsx test-viscoach-part1.ts

      - name: Backup import fixture tests
        run: bun run tsx test-backup-import.ts

      - name: Legacy data integrity regression tests
        run: bun run test:audit-data-integrity

      - name: Clean-start database migration tests
        run: bun run test:clean-start-migration

      - name: Backup import security validation tests
        run: bun run tsx test-security-backup-validation.ts

      - name: Full backup and restore round-trip tests
        run: bun run tsx test-backup-roundtrip.ts

      - name: Session rod effort tests
        run: bun run tsx test-session-rods.ts

      - name: Time-slot exposure diagnostic tests
        run: bun run tsx test-time-slot-exposure.ts

      - name: Time-slot catch evidence audit tests
        run: bun run tsx test-time-slot-catch-evidence.ts

      - name: VisCoach session advice tests
        run: bun run tsx test-session-coach.ts
      - name: Prebait planner regression tests
        run: bun run tsx test-prebait-engine.ts
      - name: VisCoach live reassessment integration tests
        run: bun run tsx test-session-coach-integration.ts

      - name: VisCoach welcome greeting tests
        run: bun run tsx test-viscoach-greetings.ts

      - name: Deterministic weather enrichment tests
        run: bun run tsx test-weather-enrichment.ts

      - name: Production build
        run: bun run build

      - name: Verify production build excludes private artifacts
        run: |
          if find dist -type f \( -iname '.env' -o -iname '.env.*' -o -iname '*backup*.json' -o -iname '*source*.zip' -o -iname '*aistudio*' \) | grep -q .; then
            echo "Private artifact detected in production output"
            exit 1
          fi
